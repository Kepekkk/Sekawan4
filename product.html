    <div class="container">
      <div class="title">Alarm Waktu Sholat</div>
      <div class="current-time" id="currentTime">00:00:00</div>

      <div class="notification" id="notification"></div>

      <div class="location-input">
        <label>Lokasi:</label>
        <div>
          <select id="citySelect">
            <option value="custom">Pilih Lokasi</option>
            <option value="jakarta">Jakarta</option>
            <option value="surabaya">Surabaya</option>
            <option value="bandung">Bandung</option>
            <option value="medan">Medan</option>
            <option value="semarang">Semarang</option>
            <option value="yogyakarta">Yogyakarta</option>
            <option value="makassar">Makassar</option>
            <option value="palembang">Palembang</option>
            <option value="malang">Malang</option>
            <option value="custom">Lokasi Lainnya</option>
          </select>
          <input
            type="text"
            id="customLocation"
            placeholder="Kota"
            style="display: none"
          />
        </div>
        <button class="btn" style="margin-top: 2%" onclick="updateLocation()">
          Update
        </button>
      </div>

      <div class="settings">
        <h3 style="margin-bottom: 15px">Settings</h3>
        <label>
          <input type="checkbox" id="enableNotification" checked />
          Aktifkan Notifikasi Suara
        </label>
        <label>
          <input type="checkbox" id="enableAlert" checked />
          Aktifkan Alert Browser
        </label>
        <label>
          <input type="checkbox" id="enable15minBefore" checked />
          Ingatkan 15 menit sebelumnya
        </label>
        <div class="settings-group">
          <label>Volume Alarm (0-100):</label>
          <input
            type="number"
            id="volumeControl"
            min="0"
            max="100"
            value="80"
          />
        </div>
